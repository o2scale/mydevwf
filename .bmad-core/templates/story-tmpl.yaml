# <!-- Powered by BMAD™ Core -->
template:
  id: story-template-v2
  name: Story Document
  version: 2.0
  output:
    format: markdown
    filename: docs/stories/{{epic_num}}.{{story_num}}.{{story_title_short}}.md
    title: "Story {{epic_num}}.{{story_num}}: {{story_title_short}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation

agent_config:
  editable_sections:
    - Status
    - Story
    - Acceptance Criteria
    - Tasks / Subtasks
    - Dev Notes
    - Testing
    - Change Log

sections:
  - id: status
    title: Status
    type: choice
    choices: [Draft, Approved, InProgress, Review, Done]
    instruction: Select the current status of the story
    owner: scrum-master
    editors: [scrum-master, dev-agent]

  - id: story
    title: Story
    type: template-text
    template: |
      **As a** {{role}},
      **I want** {{action}},
      **so that** {{benefit}}
    instruction: Define the user story using the standard format with role, action, and benefit
    elicit: true
    owner: scrum-master
    editors: [scrum-master]

  - id: acceptance-criteria
    title: Acceptance Criteria
    type: numbered-list
    instruction: Copy the acceptance criteria numbered list from the epic file
    elicit: true
    owner: scrum-master
    editors: [scrum-master]

  - id: tasks-subtasks
    title: Tasks / Subtasks
    type: bullet-list
    instruction: |
      Break down the story into specific tasks and subtasks needed for implementation.
      Reference applicable acceptance criteria numbers where relevant.
    template: |
      - [ ] Task 1 (AC: # if applicable)
        - [ ] Subtask1.1...
      - [ ] Task 2 (AC: # if applicable)
        - [ ] Subtask 2.1...
      - [ ] Task 3 (AC: # if applicable)
        - [ ] Subtask 3.1...
    elicit: true
    owner: scrum-master
    editors: [scrum-master, dev-agent]

  - id: dev-notes
    title: Dev Notes
    instruction: |
      Populate relevant information, only what was pulled from actual artifacts from docs folder, relevant to this story:
      - CRITICAL: Check docs/knowledge-base/ for existing patterns/integrations before implementing (backend-patterns/, ui-patterns/, integrations/, common-issues/)
      - CRITICAL: Create KB entry if implementing new integration or significant pattern
      - If using Context7 MCP for research, include key findings and architecture decisions here
      - Do not invent information
      - If known add Relevant Source Tree info that relates to this story
      - If there were important notes from previous story that are relevant to this one, include them here
      - Include references to relevant KB entries if they exist
      - Put enough information in this section so that the dev agent should NEVER need to read the architecture documents, these notes along with the tasks and subtasks must give the Dev Agent the complete context it needs to comprehend with the least amount of overhead the information to complete the story, meeting all AC and completing all tasks+subtasks
    elicit: true
    owner: scrum-master
    editors: [scrum-master]
    sections:
      - id: testing-standards
        title: Testing
        instruction: |
          BMad V4 Testing Strategy (per testing-stack-guide.md):
          - CRITICAL: Vitest ONLY for complex logic (10+ edge cases) → Location: docs/qa/unit/
          - CRITICAL: E2E test SCENARIOS (markdown format, NOT .spec.ts) → Location: docs/qa/e2e/sprint-{N}/epics/epic-{N}/story-{N}/
          - CRITICAL: Playwright MCP for E2E execution (26 interactive browser tools)
          - CRITICAL: Dev writes test scenarios, QA executes tests (Dev does NOT run tests)
          - CRITICAL: NO Jest allowed (replaced by Vitest)
          - Any specific testing requirements for this story
        elicit: true
        owner: scrum-master
        editors: [scrum-master]

      - id: navigation-notes
        title: Navigation Notes (MANDATORY for user-facing features)
        instruction: |
          CRITICAL: This section is MANDATORY for stories that create/modify user-facing pages or features.
          You MUST specify EXACT menu items, breadcrumbs, and user journey - how users will REACH this feature.

          If story is backend-only with NO UI changes: Write "N/A - Backend only, no navigation changes"
          If story has ANY user-facing component: MUST populate all applicable sections below.

          Reference docs/front-end-spec.md Navigation Structure section.

          WHY THIS MATTERS: Features without navigation integration are UNREACHABLE and effectively broken.
          Dev cannot skip this - QA will verify navigation independently and FAIL stories with missing menus.
        template: |
          **Reference**: docs/front-end-spec.md - Navigation Structure & User Flows

          **Menu Items** (if applicable):
          - {Menu location}: Add "{Label}" → {route path}
          - Example: Primary Nav: "Transcriptions" → /transcriptions

          **Buttons/Links on Existing Pages** (if applicable):
          - {Page name}: Add "{Button Label}" → {action/route}
          - Example: Queue Page: "Verify" button → /verify/{id}

          **Breadcrumbs** (if applicable):
          - {Breadcrumb hierarchy}
          - Example: Dashboard > Transcriptions > Verify

          **Entry Points**:
          1. {How users access this feature}
          2. {Alternative navigation paths}
          - Example: 1) Primary Nav "Transcriptions" menu item, 2) Dashboard widget "Recent Transcriptions"
        elicit: true
        owner: scrum-master
        editors: [scrum-master, dev-agent]

  - id: change-log
    title: Change Log
    type: table
    columns: [Date, Version, Description, Author]
    instruction: |
      Track changes made to this story document.
      CRITICAL: Use timestamp protocol - date +%Y-%m-%d %H:%M:%S (bash/WSL)
    owner: scrum-master
    editors: [scrum-master, dev-agent, qa-agent]

  - id: dev-agent-record
    title: Dev Agent Record
    instruction: This section is populated by the development agent during implementation
    owner: dev-agent
    editors: [dev-agent]
    sections:
      - id: agent-model
        title: Agent Model Used
        template: "{{agent_model_name_version}}"
        instruction: Record the specific AI agent model and version used for development
        owner: dev-agent
        editors: [dev-agent]

      - id: debug-log-references
        title: Debug Log References
        instruction: Reference any debug logs or traces generated during development
        owner: dev-agent
        editors: [dev-agent]

      - id: completion-notes
        title: Completion Notes List
        instruction: Notes about the completion of tasks and any issues encountered
        owner: dev-agent
        editors: [dev-agent]

      - id: file-list
        title: File List
        instruction: List all files created, modified, or affected during story implementation
        owner: dev-agent
        editors: [dev-agent]

      - id: handoff-references
        title: Handoff Documents
        instruction: |
          Track handoff documents created during story lifecycle (per handoff-templates.md):
          - Story Handoff (Orchestrator → Dev): docs/handoffs/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}-story-handoff.md | Git: handoff({story})
          - QA Handoff (Dev → QA): docs/handoffs/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}-qa-handoff.md | Git: handoff({story})
          - Developer Handoff (QA → Dev, if FAIL/CONCERNS): docs/handoffs/.../developer-handoff.md | Git: handoff({story})
          - Test Review Handoff (Orchestrator → QA/Dev, if test vetting): docs/handoffs/.../test-review-handoff.md | Git: handoff({story})
          - Completion Handoff (QA → Dev, if PASS): docs/handoffs/.../completion-handoff.md | Git: handoff({story})
          - Story Completion Summary (Dev → Orchestrator, after PASS): docs/handoffs/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}-completion-summary.md | Git: handoff({story})
          - CRITICAL: Each handoff document must be committed to git immediately after creation (see git-workflow-guide.md Handoff Commits section)
          - Code Commits: Track commit hashes for Commit Point 1 (feat: Dev implementation), Commit Point 2 (fix: Dev fixes), Commit Point 3 (chore: QA approval)
        owner: dev-agent
        editors: [dev-agent, qa-agent]

  - id: qa-results
    title: QA Results
    instruction: |
      QA review results with quality gate decision:
      - Quality Gate File: docs/qa/gates/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}.yml
      - Gate Status: PASS / CONCERNS / FAIL / WAIVED (with rationale)
      - Test Results: Vitest (X/N passed), E2E (X/N passed)
      - Evidence Location: docs/qa/evidence/sprint-{N}/epics/epic-{N}/story-{N}/ (screenshots, console logs, page snapshots)
      - Completion Handoff: (if PASS) docs/handoffs/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}-completion-handoff.md
      - Developer Handoff: (if FAIL/CONCERNS) docs/handoffs/sprint-{N}/epics/epic-{N}/{epic}.{story}-{slug}-developer-handoff.md
      - CRITICAL: Use timestamp protocol - date +%Y-%m-%d %H:%M:%S (bash/WSL)
    owner: qa-agent
    editors: [qa-agent]
